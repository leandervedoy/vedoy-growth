<!doctype html><html lang="nb"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vedøy Booking – offline demo</title>
<style>
:root{color-scheme:light;--bg:#f4f1ea;--panel:#fbfaf7;--line:#ddd8ce;--muted:#78766f;--ink:#171816;--blue:#2867ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Arial,sans-serif}button{font:inherit;color:inherit}main{display:grid;grid-template-columns:300px minmax(0,1fr);gap:16px;max-width:1120px;min-height:100vh;margin:auto;padding:12px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:24px}.eyebrow{font:10px/1.2 monospace;letter-spacing:.14em;color:#65706f;text-transform:uppercase}h1{margin:14px 0 6px;font-size:30px;letter-spacing:-.06em}p{color:var(--muted)}.chips,.times{display:flex;flex-wrap:wrap;gap:8px;margin:22px 0}.chip,.time,.nav{border:1px solid var(--line);border-radius:999px;background:transparent;padding:9px 13px;cursor:pointer}.chip.active,.time.active{background:#171816;color:#fff;border-color:#171816}.service{position:relative;width:100%;margin:9px 0;padding:16px 16px 16px 28px;text-align:left;background:transparent;border:1px solid var(--line);border-radius:15px;cursor:pointer}.service:before{content:"";position:absolute;left:13px;top:15px;bottom:15px;width:3px;border-radius:2px;background:var(--accent)}.service.active{border-color:var(--blue);box-shadow:0 0 0 2px #2867ff22}.service strong,.service span{display:block}.service span{margin-top:4px;color:var(--muted);font-size:12px}.divider{height:1px;background:var(--line);margin:28px 0}.toolbar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:14px}.navs{display:flex;gap:7px}.nav{border-radius:8px;padding:8px 11px}.month{text-align:center;font-size:16px}.week,.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:7px}.week{margin:28px 0 8px;text-align:center;font:10px monospace;color:#666}.day{aspect-ratio:1.05;min-height:58px;padding:10px;text-align:left;border:1px solid #e5e1d8;border-radius:14px;background:transparent;font-weight:700;cursor:pointer}.day.out{color:#b8b5ad}.day.active{border:2px solid #171816}.day.active span{display:grid;width:24px;height:24px;place-items:center;border-radius:50%;background:#171816;color:#fff}.slots{border-top:1px solid var(--line);margin-top:20px;padding-top:24px}.slot-head{display:flex;justify-content:space-between;align-items:center}.duration{border:1px solid var(--line);border-radius:999px;padding:7px 11px;font:11px monospace}.summary{margin-top:18px;padding:14px;border-radius:12px;background:#efede7;color:#555}button:focus-visible{outline:3px solid #2867ff55;outline-offset:2px}@media(max-width:760px){main{grid-template-columns:1fr}.day{min-height:48px;padding:7px}.panel{padding:18px}.toolbar{grid-template-columns:1fr}.month{text-align:left;grid-row:1}.week{margin-top:18px}}
</style></head><body><main>
<aside class="panel"><div class="eyebrow">Velg tjeneste</div><h1>Vedøy Booking</h1><p>Velg tjeneste, tidspunkt og kundeinformasjon.</p><div class="chips"><button class="chip active">Alle</button><button class="chip">IT-hjelp</button><button class="chip">Bedrift</button><button class="chip">Vekst</button></div>
<button class="service active" style="--accent:#2867ff" data-service="Digital IT-hjelp"><strong>Digital IT-hjelp</strong><span>60 min · 350 kr</span><span>Rolig hjelp via telefon eller sikker skjermdeling.</span></button><button class="service" style="--accent:#19a866" data-service="Hjemmebesøk"><strong>Hjemmebesøk</strong><span>90 min · 599 kr</span><span>PC, TV, Wi-Fi, printer eller mobil hjemme hos kunden.</span></button><button class="service" style="--accent:#8a3ffc" data-service="Digital bedriftssjekk"><strong>Digital bedriftssjekk</strong><span>120 min · 1 190 kr</span><span>Gjennomgang av nettside, e-post, sikkerhet og rutiner.</span></button><button class="service" style="--accent:#f0642d" data-service="Nettside og vekst"><strong>Nettside og vekst</strong><span>90 min · 890 kr</span><span>Praktisk sparring om nettside og synlighet.</span></button><div class="divider"></div><div class="eyebrow">Velg plan</div><div class="chips"><button class="chip active">Ingen plan</button><button class="chip">Enkelttime</button><button class="chip">Trygg</button><button class="chip">Growth</button></div></aside>
<section class="panel"><header class="toolbar"><div class="navs"><button class="nav">Forrige</button><button class="nav">I dag</button><button class="nav">Neste</button></div><strong class="month">August 2026</strong></header><div class="week" aria-hidden="true"><span>M</span><span>T</span><span>O</span><span>T</span><span>F</span><span>L</span><span>S</span></div><div class="days" id="days"></div><div class="slots"><div class="slot-head"><div><div class="eyebrow">Velg tidspunkt</div><strong id="dateLabel">22. august 2026</strong></div><span class="duration">60 min</span></div><div class="times"><button class="time">09:00</button><button class="time active">10:30</button><button class="time">12:00</button><button class="time">14:00</button><button class="time">15:30</button></div><div class="summary" id="summary" aria-live="polite">Digital IT-hjelp · 22. august kl. 10:30</div></div></section>
</main><script>
const grid=[27,28,29,30,31,...Array.from({length:31},(_,i)=>i+1),1,2,3,4,5,6],days=document.querySelector('#days'),summary=document.querySelector('#summary'),dateLabel=document.querySelector('#dateLabel');let service='Digital IT-hjelp',date=22,time='10:30';function update(){summary.textContent=`${service} · ${date}. august kl. ${time}`;dateLabel.textContent=`${date}. august 2026`}grid.forEach((n,i)=>{const b=document.createElement('button');b.className='day'+(i<5||i>35?' out':'')+(n===22&&i===26?' active':'');b.innerHTML=`<span>${n}</span>`;b.setAttribute('aria-label',`${n}. august 2026`);b.onclick=()=>{if(i<5||i>35)return;document.querySelectorAll('.day').forEach(x=>x.classList.remove('active'));b.classList.add('active');date=n;update()};days.appendChild(b)});document.querySelectorAll('.service').forEach(b=>b.onclick=()=>{document.querySelectorAll('.service').forEach(x=>x.classList.remove('active'));b.classList.add('active');service=b.dataset.service;update()});document.querySelectorAll('.time').forEach(b=>b.onclick=()=>{document.querySelectorAll('.time').forEach(x=>x.classList.remove('active'));b.classList.add('active');time=b.textContent;update()});document.querySelectorAll('.chips').forEach(g=>g.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{g.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));b.classList.add('active')}));
</script></body></html>
